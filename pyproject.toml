[project]
name = "mads"
version = "0.1.0"
description = "Mads — personal AI Chief of Staff"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.2.0",
    "mcp>=1.2.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.154.0",
    "cryptography>=43.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
    "pillow>=11.0.0",
    "python-pptx>=1.0.2",
    "pydantic>=2.9.0",
]

[project.scripts]
mads = "cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "auth", "cli", "config", "mcp_servers", "memory", "planner", "utils"]
